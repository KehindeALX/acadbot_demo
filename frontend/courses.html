<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Courses | MSA AcadBot</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <nav class="navbar">
    <a href="courses.html" class="navbar__logo">
      <span class="navbar__logo-text">MSA <span>AcadBot</span></span>
      <!-- Swap for real logo: <img class="navbar__logo-img" src="assets/logo.svg" alt="MSA AcadBot"/> -->
    </a>
    <div class="navbar__nav">
      <a href="courses.html" class="navbar__link navbar__link--active">Courses</a>
      <a href="acadbot.html" class="navbar__link">Ask AcadBot</a>
      <a href="msa-guide.html" class="navbar__link">MSA Guide</a>
      <div id="authNav">
        <!-- Authenticated nav will be injected here -->
      </div>
    </div>
  </nav>

  <main class="page__main">
    <header class="page__header">
      <h1 class="page__title">Explore Courses</h1>
      <p class="page__subtitle">Discover MSA-certified courses across high-demand career paths. Start learning today.</p>
    </header>

    <!-- Career Filter -->
    <section class="page__section" id="filterSection" aria-label="Filter courses by career">
      <div class="d-flex flex-wrap gap-2" id="careerFilters" role="group" aria-label="Filter courses by career">
        <button class="btn btn--primary" aria-pressed="true" data-career="">All Careers</button>
        <!-- Career filter buttons injected here -->
      </div>
    </section>

    <!-- Courses Grid -->
    <section class="page__section" aria-label="Course listings">
      <div id="coursesGrid" class="grid grid--auto" role="list">
        <!-- Course cards injected here -->
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="loading hidden" aria-live="polite">
        <div class="loading__spinner"></div>
        <span>Loading courses...</span>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-state__icon">📚</div>
        <h3 class="empty-state__title">No Courses Found</h3>
        <p class="empty-state__message">No published courses match your current filter. Try selecting a different career or check back later.</p>
        <button class="btn btn--secondary empty-state__action" id="clearFilterBtn">Clear Filters</button>
      </div>
    </section>

    <!-- Pagination -->
    <nav id="pagination" class="pagination hidden" aria-label="Course pagination">
      <!-- Pagination links injected here -->
    </nav>
  </main>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/courses.js"></script>
</body>
</html>
