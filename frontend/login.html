<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | MSA AcadBot</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar__logo">
      <span class="navbar__logo-text">MSA <span>AcadBot</span></span>
      <!-- Swap for real logo: <img class="navbar__logo-img" src="assets/logo.svg" alt="MSA AcadBot"/> -->
    </a>
    <div class="navbar__nav">
      <a href="index.html" class="navbar__link">Home</a>
      <a href="courses.html" class="navbar__link">Courses</a>
      <a href="acadbot.html" class="navbar__link">Ask AcadBot</a>
      <a href="msa-guide.html" class="navbar__link">MSA Guide</a>
      <a href="register.html" class="navbar__link">Sign Up</a>
    </div>
  </nav>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-card__logo">
        <a href="index.html" class="navbar__logo">
          <span class="navbar__logo-text">MSA <span>AcadBot</span></span>
        </a>
      </div>
      <h1 class="auth-card__title">Welcome Back</h1>
      <p class="auth-card__subtitle">Sign in to continue your learning journey</p>

      <form id="loginForm" class="auth-card__form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <div class="input-wrapper">
            <span class="input-wrapper__icon">📧</span>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              required
              aria-describedby="emailError"
            />
          </div>
          <div id="emailError" class="form-error" role="alert"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <span class="input-wrapper__icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              aria-describedby="passwordError"
            />
          </div>
          <div id="passwordError" class="form-error" role="alert"></div>
        </div>

        <div id="formError" class="alert alert--error hidden" role="alert">
          <span class="alert__icon">⚠</span>
          <div class="alert__content">
            <div class="alert__message" id="formErrorMessage"></div>
          </div>
          <button type="button" class="alert__dismiss" aria-label="Dismiss error">✕</button>
        </div>

        <button type="submit" class="btn btn--primary btn--block btn--lg" id="submitBtn">
          <span class="btn__text">Sign In</span>
          <span class="btn__loading hidden">Signing in...</span>
        </button>
      </form>

      <div class="auth-card__footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </main>

  <!-- Toast container for notifications -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
