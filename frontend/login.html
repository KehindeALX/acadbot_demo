<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | MSA AcadBot</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar__logo">
      <span class="navbar__logo-text">MSA <span>AcadBot</span></span>
      <!-- Swap for real logo: <img class="navbar__logo-img" src="assets/logo.svg" alt="MSA AcadBot"/> -->
    </a>
    <div class="navbar__nav">
      <a href="index.html" class="navbar__link">Home</a>
      <a href="courses.html" class="navbar__link">Courses</a>
      <a href="acadbot.html" class="navbar__link">Ask AcadBot</a>
      <a href="msa-guide.html" class="navbar__link">MSA Guide</a>
      <div id="authNav"></div>
    </div>
  </nav>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-card__logo">
        <a href="index.html" class="navbar__logo">
          <span class="navbar__logo-text">MSA <span>AcadBot</span></span>
        </a>
      </div>
      <h1 class="auth-card__title">Welcome Back</h1>
      <p class="auth-card__subtitle">Sign in to continue your learning journey</p>

      <form id="loginForm" class="auth-card__form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Username or Email</label>
          <div class="input-wrapper">
            <span class="input-wrapper__icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input
              type="text"
              id="email"
              name="identifier"
              class="form-input"
              placeholder="username or email"
              autocomplete="username"
              required
              aria-describedby="emailError"
            />
          </div>
          <div id="emailError" class="form-error" role="alert"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <span class="input-wrapper__icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input form-input--has-toggle"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              aria-describedby="passwordError"
            />
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
              <!-- Eye open -->
              <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye closed (hidden by default) -->
              <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <div id="passwordError" class="form-error" role="alert"></div>
        </div>

        <div id="formError" class="alert alert--error hidden" role="alert">
          <span class="alert__icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </span>
          <div class="alert__content">
            <div class="alert__message" id="formErrorMessage"></div>
          </div>
          <button type="button" class="alert__dismiss" aria-label="Dismiss error">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <button type="submit" class="btn btn--primary btn--block btn--lg" id="submitBtn">
          <span class="btn__text">Sign In</span>
          <span class="btn__loading hidden">Signing in...</span>
        </button>
      </form>

      <div class="auth-card__footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </main>

  <!-- Toast container for notifications -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/login.js"></script>

  <!-- Auth-aware navbar -->
  <script type="module">
    import { initNavbar } from './js/navbar.js';
    initNavbar();
  </script>
</body>
</html>
